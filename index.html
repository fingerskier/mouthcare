<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="Mouthcare timer — Closys, brush, Listerine, ACT" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mouthcare" />
  <title>Mouthcare</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">Mouthcare</h1>
      <p class="tagline">Swish · Brush · Rinse</p>
    </header>

    <main class="main">
      <ol id="step-list" class="step-list" aria-label="Routine steps"></ol>

      <section id="timer-panel" class="timer-panel" aria-live="polite">
        <p id="step-label" class="step-label">Ready</p>
        <div class="ring-wrap" aria-hidden="true">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="54" />
            <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="54" />
          </svg>
          <div class="countdown-wrap">
            <span id="countdown" class="countdown">—</span>
            <span id="countdown-unit" class="countdown-unit">sec</span>
          </div>
        </div>
        <p id="status-text" class="status-text">Tap Start to begin your routine</p>
      </section>

      <div class="actions">
        <button id="btn-primary" type="button" class="btn btn-primary">Start</button>
      </div>
    </main>

    <footer class="footer">
      <p>Works offline · Install as app</p>
    </footer>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
